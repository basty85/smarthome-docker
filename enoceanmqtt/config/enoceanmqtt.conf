# enoceanmqtt Konfiguration
# Ersetzt Homegear als EnOcean-Bridge
#
# Alle Geräte-IDs aus Homegear DB extrahiert (homegear/data/db.sql):
#   Homegear-Serial "EOD0XXXXXXXX" → RF-Adresse 0xXXXXXXXX (letzten 8 Hex-Zeichen)
#
# WICHTIG - Teach-In / Anlernvorgang:
#   Die OPUS BRiDGE Aktoren wurden mit Homegear angelernt (USB300-Stick = gleiche Hardware).
#   Da der USB300-Stick dieselbe Hardware-Base-ID behält, sollten die Aktoren auf Befehle
#   reagieren ohne erneutes Anlernen. Falls nicht → am jeweiligen Aktor den Anlernknopf
#   drücken während enoceanmqtt einen Teach-In-Telegramm sendet.
#
# Positionsskala: D2-05-02 verwendet 0–100%
#   0% = offen / hochgefahren
#   100% = geschlossen / runtergefahren
#   HA-Cover-Entities: position 0 = geschlossen, position 100 = offen (→ invertiert)
#   enoceanmqtt handhabt die Invertierung automatisch für HA.

[CONFIG]
mqtt_host = localhost
mqtt_port = 1883
enocean_port = /dev/enocean
mqtt_discovery = True
mqtt_discovery_prefix = homeassistant
log_level = INFO

# ---------------------------------------------------------------------------
# Jalousien (EG) – OPUS BRiDGE, EEP D2-05-02 (Position + Winkel)
# ---------------------------------------------------------------------------

[wohnzimmer_jalousie_links]
id = 0x050BF2A4
eep = D2-05-02

