# enoceanmqtt Konfiguration
# Ersetzt Homegear als EnOcean-Bridge
#
# Alle Geräte-IDs aus Homegear DB extrahiert (homegear/data/db.sql):
#   Homegear-Serial "EOD0XXXXXXXX" → RF-Adresse 0xXXXXXXXX (letzten 8 Hex-Zeichen)
#
# EEP D2-05-02 (VLD Blinds Control for Position and Angle):
#   rorg = 0xD2, func = 0x05, type = 0x02

[CONFIG]
mqtt_host = localhost
mqtt_port = 1883
mqtt_prefix = enoceanmqtt/
enocean_port = /dev/enocean
overlay = HA
mqtt_discovery_prefix = homeassistant/
log_level = INFO
mapping_file = /config/mapping.yaml
db_file = /config/devices.db

# ---------------------------------------------------------------------------
# Jalousien (EG) – OPUS BRiDGE, EEP D2-05-02 (Position + Winkel)
# ---------------------------------------------------------------------------

[wohnzimmer_jalousie_links]
address = 0x050BF2A4
rorg    = 0xD2
func    = 0x05
type    = 0x02

[wohnzimmer_jalousie_mitte]
address = 0x050BF887
rorg    = 0xD2
func    = 0x05
type    = 0x02

[wohnzimmer_jalousie_rechts]
