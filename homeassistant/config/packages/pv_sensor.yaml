sensor:
  - platform: integration
    source: sensor.pv_battery_discharge_w
    method: left
    unit_prefix: k
    name: PV Battery Discharge kWh

  - platform: integration
    source: sensor.pv_battery_charge_w
    method: left
    unit_prefix: k
    name: PV Battery Charge kWh

  - platform: integration
    source: sensor.pv_house_consumption_w
    method: left
    unit_prefix: k
    name: PV House Consumption kWh

  - platform: integration
    source: sensor.pv_panel_to_house_w
    method: left
    unit_prefix: k
    name: PV Panel To House kWh

  - platform: statistics
    name: "PV Inverter Effectiveness 24h Average"
    state_characteristic: mean
    max_age:
      hours: 24
    entity_id: sensor.pv_inverter_effectiveness
