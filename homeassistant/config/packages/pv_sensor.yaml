sensor:
  - platform: integration
    source: sensor.solar_battery_discharge_w
    method: left
    unit_prefix: k
    name: solar_battery_out_kwh

  - platform: integration
    source: sensor.solar_battery_charge_w
    method: left
    unit_prefix: k
    name: solar_battery_in_kwh

  - platform: integration
    source: sensor.solar_house_consumption_w
    method: left
    unit_prefix: k
    name: solar_house_consumption_kwh

  - platform: integration
    source: sensor.solar_panel_to_house_w
    method: left
    unit_prefix: k
    name: solar_panel_to_house_kwh

  - platform: statistics
    name: "Solar Inverter Effectiveness 24h Average"
    state_characteristic: mean
    max_age:
      hours: 24
    entity_id: sensor.solar_inverter_effectiveness
