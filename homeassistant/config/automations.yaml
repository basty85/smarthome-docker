- id: '1783744518402'
  alias: Ventilator Low
  description: ''
  triggers:
  - trigger: template
    value_template: '{{ states(''sensor.draussen_gw1100a_outdoor_temperature'') | float
      > states(''sensor.kuche_innenraumklimasensor_temperatur'') | float + 2 }}'
    for:
      minutes: 20
  conditions: []
  actions:
  - action: select.select_option
    target:
      entity_id: select.vvm_500_fan_speed
    data:
      option: Speed 1
  mode: single
- id: '1783744872756'
  alias: Ventilator Normal
  description: ''
  triggers:
  - trigger: template
    value_template: '{{ states(''sensor.draussen_gw1100a_outdoor_temperature'') | float
      <

      states(''sensor.kuche_innenraumklimasensor_temperatur'') | float - 1 }}'
    for:
      minutes: 20
  conditions: []
  actions:
  - action: select.select_option
    target:
      entity_id: select.vvm_500_fan_speed
    data:
      option: Normal
  mode: single
