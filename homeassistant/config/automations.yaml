# =============================================================================
# Automationen – migriert von OpenHAB
#
# ENTITY IDs NACH ERSTER INBETRIEBNAHME PRÜFEN:
#
# Cover (EnOcean via enoceanmqtt – aus enoceanmqtt.conf):
#   cover.wohnzimmer_jalousie_links / _mitte / _rechts
#   cover.esszimmer_jalousie
#   cover.musikzimmer_rolladen, cover.wc_rolladen
#   cover.schlafzimmer_jalousie_links / _rechts / _oben
#   cover.kinderzimmer_jalousie_links / _rechts / _oben
#   cover.ankleide_jalousie
#   cover.buero_rolladen, cover.bad_rolladen
#
# Lichter Z-Wave (in Z-Wave JS UI → HA nach Einrichtung überprüfen):
#   switch.hwr_lichtaktor_switch  (Qubino node_id=5)
#   switch.flur_lichtaktor_switch (Qubino node_id=3)
#   switch.treppenhaus_ug_lichtaktor_switch (Qubino node_id=4)
#   switch.esszimmer_dimmer_switch / light.esszimmer_dimmer (Qubino node_id=6)
#   switch.aussen_lichtaktor_switch (Qubino node_id=2)
#
# Sensoren Hue (nach Hue-Integration in HA überprüfen – Namen aus der Hue App):
#   binary_sensor.<hwr_sensor>_motion
#   binary_sensor.<treppe_sensor_oben>_motion
#   binary_sensor.<treppe_sensor_ug>_motion
#   binary_sensor.<flur_sensor>_motion
#   binary_sensor.<outdoor_sensor>_motion
#   sensor.<hwr_sensor>_illuminance     (Lichtstärke in Lux)
#   sensor.<outdoor_sensor>_illuminance
#   light.hue_white_blumenbeet          (hueWhite1)
#
# Positionsskala:
#   HA cover position: 0 = geschlossen, 100 = offen
#   HA cover tilt_position: 0 = geschlossen, 100 = offen
#   OH-Wert 0.XX → HA-Position = (1 - 0.XX) * 100
#
# Z-Wave Netzwerkschlüssel (für Z-Wave JS UI Ersteinrichtung):
#   S0: 36 05 66 8F F9 E4 DF E4 0A EF E7 DF AC DF 21 07
# =============================================================================


# =============================================================================
# 1. SONNENUNTERGANG – Jalousien & Rolladen schließen
#    (entspricht sunset_static.rules)
# =============================================================================
- id: "sunset_jalousien_schliessen"
  alias: "Sonnenuntergang: Jalousien und Rolladen schließen"
  trigger:
    - platform: sun
      event: sunset
  action:
    # Wohnzimmer Jalousien – voll schließen (OH: pos 0.01, angle 0.01)
    - service: cover.close_cover
      target:
        entity_id:
          - cover.wohnzimmer_jalousie_links
          - cover.wohnzimmer_jalousie_mitte
          - cover.wohnzimmer_jalousie_rechts

    # Esszimmer Jalousie – teilweise (OH: pos 0.80, angle 0.75)
    - delay: "00:00:01"
    - service: cover.set_cover_position
      target:
        entity_id: cover.esszimmer_jalousie
      data:
        position: 20  # HA 20 = OH 0.80 geschlossen
    - service: cover.set_cover_tilt_position
      target:
        entity_id: cover.esszimmer_jalousie
      data:
        tilt_position: 25  # HA 25 = OH angle 0.75

    # Musikzimmer Rolladen (OH: pos 0.65)
    - delay: "00:00:01"
    - service: cover.set_cover_position
      target:
        entity_id: cover.musikzimmer_rolladen
      data:
        position: 35  # HA 35 = OH 0.65 geschlossen

    # WC Rolladen (OH: pos 0.70)
    - delay: "00:00:01"
    - service: cover.set_cover_position
      target:
        entity_id: cover.wc_rolladen
      data:
        position: 30  # HA 30 = OH 0.70 geschlossen

    # Büro Rolladen (OH: pos 0.80)
    - delay: "00:00:01"
    - service: cover.set_cover_position
      target:
        entity_id: cover.buero_rolladen
      data:
        position: 20  # HA 20 = OH 0.80 geschlossen

    # Bad Rolladen (OH: pos 0.80)
    - delay: "00:00:01"
    - service: cover.set_cover_position
      target:
        entity_id: cover.bad_rolladen
      data:
        position: 20


# =============================================================================
# 2. SONNENAUFGANG – Rolladen öffnen
#    (entspricht sunrise_static.rules)
# =============================================================================
- id: "sunrise_rolladen_oeffnen"
  alias: "Sonnenaufgang: Rolladen öffnen"
  trigger:
    - platform: sun
      event: sunrise
  action:
    - service: cover.open_cover
      target:
        entity_id:
          - cover.musikzimmer_rolladen
          - cover.wc_rolladen
          - cover.buero_rolladen
          - cover.bad_rolladen


# =============================================================================
# 3. MITTAGSSONNE – Jalousien Wohnzimmer beschatten (wenn nicht bewölkt)
#    (entspricht noon_dynamic.rules)
#    Bedingung: Bewölkung < 75% → Wetterdaten aus OpenWeatherMap Integration
#    Entity ID nach Einrichtung der OpenWeatherMap Integration prüfen!
# =============================================================================
- id: "mittag_jalousien_beschatten"
  alias: "Mittagssonne: Wohnzimmer Jalousien beschatten"
  trigger:
    - platform: sun
      event: noon
  condition:
    - condition: numeric_state
      entity_id: sensor.wetter_cleebronn_cloud_coverage  # OpenWeatherMap Entity anpassen
      below: 75
  action:
    # Jalousie Links (OH: pos 0.80, angle 0.60)
    - service: cover.set_cover_position
      target:
        entity_id: cover.wohnzimmer_jalousie_links
      data:
        position: 20  # HA 20 = OH 0.80 geschlossen
    - service: cover.set_cover_tilt_position
      target:
        entity_id: cover.wohnzimmer_jalousie_links
      data:
        tilt_position: 40  # HA 40 = OH angle 0.60

    # Jalousie Mitte (OH: pos 0.40, angle 0.60)
    - service: cover.set_cover_position
      target:
        entity_id: cover.wohnzimmer_jalousie_mitte
      data:
        position: 60  # HA 60 = OH 0.40 geschlossen
    - service: cover.set_cover_tilt_position
      target:
        entity_id: cover.wohnzimmer_jalousie_mitte
      data:
        tilt_position: 40

    # Jalousie Rechts (OH: pos 0.80, angle 0.55)
    - service: cover.set_cover_position
      target:
        entity_id: cover.wohnzimmer_jalousie_rechts
      data:
        position: 20
    - service: cover.set_cover_tilt_position
      target:
        entity_id: cover.wohnzimmer_jalousie_rechts
      data:
        tilt_position: 45  # HA 45 = OH angle 0.55


# =============================================================================
# 4. SONNENAUFGANG DYNAMISCH – Ankleide Jalousie (wenn nicht bewölkt)
#    (entspricht sunrise_dynamic.rules)
# =============================================================================
- id: "sunrise_ankleide_jalousie"
  alias: "Sonnenaufgang: Ankleide Jalousie"
  trigger:
    - platform: sun
      event: sunrise
  action:
    - choose:
        # Nicht bewölkt: Jalousie halb offen, Lamellen geschlossen
        - conditions:
            - condition: numeric_state
              entity_id: sensor.wetter_cleebronn_cloud_coverage
              below: 75
          sequence:
            - service: cover.set_cover_position
              target:
                entity_id: cover.ankleide_jalousie
              data:
                position: 0   # geschlossen (OH: pos 1.0)
            - service: cover.set_cover_tilt_position
              target:
                entity_id: cover.ankleide_jalousie
              data:
                tilt_position: 100  # Lamellen offen (OH: angle 0.0)
      # Bewölkt: voll offen
      default:
        - service: cover.open_cover
          target:
            entity_id: cover.ankleide_jalousie


# =============================================================================
# 5. BEWEGUNGSLICHT HWR – Licht bei Bewegung und Dunkelheit
#    (entspricht motion_light.rules – DetectPresenceAndSwitchLight_HWR_EG)
#    Entity IDs der Hue-Sensoren nach Einrichtung anpassen!
# =============================================================================
- id: "bewegungslicht_hwr_an"
  alias: "Bewegungslicht HWR: Licht bei Bewegung an"
  trigger:
    - platform: state
      entity_id: binary_sensor.hwr_sensor_motion  # Hue Sensor HWR – Entity ID anpassen
      to: "on"
  condition:
    - condition: numeric_state
      entity_id: sensor.hwr_sensor_illuminance  # Hue Lichtsensor HWR – Entity ID anpassen
      below: 10  # < 10 lx = dunkel (entspricht OH lightLevelSensorHWR_Dark)
  action:
    - service: light.turn_on
      target:
        entity_id: light.hwr  # Z-Wave Lichtaktor – Entity ID anpassen

- id: "bewegungslicht_hwr_aus"
  alias: "Bewegungslicht HWR: Licht nach 20s ohne Bewegung aus"
  trigger:
    - platform: state
      entity_id: binary_sensor.hwr_sensor_motion  # Hue Sensor HWR – Entity ID anpassen
      to: "off"
      for: "00:00:20"
  action:
    - service: light.turn_off
      target:
        entity_id: light.hwr  # Z-Wave Lichtaktor – Entity ID anpassen


# =============================================================================
# 6. BEWEGUNGSLICHT TREPPENHAUS – Licht bei Bewegung (kein Dunkelheit-Check)
#    (entspricht motion_light.rules – DetectPresenceAndSwitchLight_Treppenhaus_UG)
# =============================================================================
- id: "bewegungslicht_treppenhaus_an"
  alias: "Bewegungslicht Treppenhaus: Licht bei Bewegung an"
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.treppenhaus_sensor_oben_motion  # Hue Sensor Treppe Oben – anpassen
        - binary_sensor.treppenhaus_sensor_ug_motion    # Hue Sensor Treppe UG – anpassen
      to: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.treppenhaus_ug  # Z-Wave Lichtaktor – Entity ID anpassen

- id: "bewegungslicht_treppenhaus_aus"
  alias: "Bewegungslicht Treppenhaus: Licht nach 30s ohne Bewegung aus"
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.treppenhaus_sensor_oben_motion  # anpassen
        - binary_sensor.treppenhaus_sensor_ug_motion    # anpassen
      to: "off"
      for: "00:00:30"
  condition:
    # Nur ausschalten wenn BEIDE Sensoren keine Bewegung melden
    - condition: state
      entity_id: binary_sensor.treppenhaus_sensor_oben_motion
      state: "off"
    - condition: state
      entity_id: binary_sensor.treppenhaus_sensor_ug_motion
      state: "off"
  action:
    - service: light.turn_off
      target:
        entity_id: light.treppenhaus_ug


# =============================================================================
# 7. DUNKELHEITSLICHT AUSSEN – Außenlicht automatisch bei Dunkelheit
#    (entspricht darkness_light.rules – DetectDarknessAndSwitchLight_Outdoor)
# =============================================================================
- id: "dunkelheitslicht_aussen_an"
  alias: "Außenlicht: Blumenbeet bei Dunkelheit an"
  trigger:
    - platform: numeric_state
      entity_id: sensor.outdoor_sensor_illuminance  # Hue Außensensor – Entity ID anpassen
      below: 10  # < 10 lx = dunkel
  action:
    - service: light.turn_on
      target:
        entity_id: light.hue_white_blumenbeet  # hueWhite1 – Entity ID anpassen

- id: "dunkelheitslicht_aussen_aus"
  alias: "Außenlicht: Blumenbeet bei Helligkeit aus"
  trigger:
    - platform: numeric_state
      entity_id: sensor.outdoor_sensor_illuminance  # Hue Außensensor – Entity ID anpassen
      above: 15  # Hysterese: > 15 lx = hell
  action:
    - service: light.turn_off
      target:
        entity_id: light.hue_white_blumenbeet
