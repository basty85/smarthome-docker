homeassistant:
  customize: !include customize.yaml
  name: Smarthome
  latitude: 49.042001413459815
  longitude: 9.036667882367395
  elevation: 257
  unit_system: metric
  time_zone: Europe/Berlin
  currency: EUR
  country: DE
  language: de
  packages: !include_dir_named packages

# Standard-Integrationen (inkl. mobile_app, discovery, etc.)
default_config:

# Mobile App Integration (fuer HA Companion App)
mobile_app:

# Automationen aus automations.yaml
automation: !include automations.yaml

frontend:
  themes: !include_dir_merge_named themes

# Skripte und Szenen (werden über UI befüllt)
script: !include scripts.yaml
scene: !include scenes.yaml

# Example configuration.yaml entry
recorder:

http:
  use_x_forwarded_for: true
  trusted_proxies: 192.168.1.51
